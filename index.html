<!DOCTYPE html>
<html lang = "en">
 <head>
     <meta charset="UTF 8">
     <meta name = "viewport" content = "width = device-width", "initial-scale=1.0">
     <title> Number Guesser </title>
     <link rel = "stylesheet" href = "style.css">
 </head>

 <body>
     <!-- Screen 1: Start -->
     <div id = "start-screen">
         <h1> NUMBER GUESSER </h1>
         <p> I'm thinking of a number between 1 to 100. You have 7 guesses </p>
         <button id = "start-btn"> Start the Game </button>
     </div>

     <!-- Screen 2: Game -->
     <div id = "Game-screen" class = "hidden">
         <h2> Make a guess </h2>
         <p id = "guess-count"> Guess 1 of 7 </p>
         <input type = "number" id = "guess-input" min = "1" max = "100" placeholder = "1-100">
         <button id = "guess-btn"> Guess </button>
         <p id "message"></p>
     </div>

     <!-- Screen 3: Game over-->
     <div id = "end-screen" class = "hidden">
         <h2 id = "end-title"> Game over </h2>
         <p id = "end-message"></p>
         <button id = "restart-btn"> Play again</button>
     </div>

     <script src = "script.js"></script>
 </body>
</html>
